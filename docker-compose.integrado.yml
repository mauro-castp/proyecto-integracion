# docker-compose.integrado.yml — Plataforma completa del Segundo Parcial
# Codex Innovations · Equipo 04
#
#   docker compose -f docker-compose.integrado.yml up --build -d
#
# Levanta PostgreSQL, Redis y MongoDB, el sistema web (http://localhost:5000)
# y los microservicios del contrato v1, cada uno en su contenedor y su puerto:
# 5101 a 5110 (Segundo Parcial), de la Ola 1 inventario (5111), precios (5112), proveedores (5113),
# abastecimiento (5114) y notificaciones (5124), y de la Ola 2 demanda (5115), cobertura (5116),
# capacidad (5117), rutas (5118), costos (5119), punto-equilibrio (5120), simulacion (5121) y surtido (5122).
#
#   Swagger de cada servicio:  http://localhost:PUERTO/api/v1/docs
#   Salud de cada servicio:    http://localhost:PUERTO/api/v1/salud
#   Entregas de demostración:  docker compose -f docker-compose.integrado.yml exec entregas python pruebas/preparar_entregas.py --cantidad 2
#
# Sigue existiendo sistema_web/docker-compose.yml para levantar solo el web:
# el sistema web funciona de manera independiente de los microservicios.

name: microhubs-integrado

x-entorno: &entorno
  SECRET_KEY: ${SECRET_KEY:-cambiar-en-produccion}         # la MISMA llave en web y servicios: sesión común
  PG_DSN: host=postgres port=5432 dbname=microhubs_p1 user=microhubs password=${POSTGRES_PASSWORD:-microhubs_dev}
  REDIS_URL: redis://redis:6379
  MONGO_URL: mongodb://mongo:27017/microhubs_eventos
  MICROSERVICIOS_URL: "http://{servicio}:{puerto}"     # cómo un servicio llama a otro por la red interna
  # Almacén de archivos (servicios/comun/almacen.py): "local" en desarrollo; en la nube "gcs" + el bucket (deploy/gcp/.env)
  ALMACEN: ${ALMACEN:-local}
  GCS_BUCKET: ${GCS_BUCKET:-}
  URL_FIRMADA_SEGUNDOS: ${URL_FIRMADA_SEGUNDOS:-300}
  VERSION_DESPLEGADA: ${VERSION_DESPLEGADA:-1.0.0}         # lo que /salud informa como versión
  DETRAS_DE_PROXY: ${DETRAS_DE_PROXY:-0}                   # 1 en la nube (Nginx delante): la IP del cliente sale de X-Forwarded-For
  LIMITE_POR_MINUTO: ${LIMITE_POR_MINUTO:-240}             # límite por IP, servicio y minuto
  LIMITE_LOGIN_POR_MINUTO: ${LIMITE_LOGIN_POR_MINUTO:-30}   # límite de inicios de sesión por IP y minuto

x-servicio: &servicio
  depends_on:
    migraciones: {condition: service_completed_successfully}
    redis: {condition: service_healthy}
    mongo: {condition: service_healthy}
  networks: [datos, publica]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped                   # vuelve a encender solo al reiniciar la máquina
    environment:
      POSTGRES_DB: microhubs_p1
      POSTGRES_USER: microhubs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-microhubs_dev}
    volumes:
      - datos_pg:/var/lib/postgresql/data
      - ./bloque_c/sql:/docker-entrypoint-initdb.d:ro       # 01 a 10 en el primer arranque
    networks: [datos]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microhubs -d microhubs_p1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped                   # vuelve a encender solo al reiniciar la máquina
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
    networks: [datos]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped                   # vuelve a encender solo al reiniciar la máquina
    volumes:
      - datos_mongo:/data/db
      - ./bloque_c/mongo:/docker-entrypoint-initdb.d:ro    # 01, 02 y 03 en el primer arranque
    networks: [datos]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Aplica 06 a 10 a volúmenes que ya existían (idempotente) y termina.
  migraciones:
    build: {context: ., dockerfile: servicios/auth/Dockerfile}
    command: ["python", "migrar.py"]
    environment: *entorno
    volumes:
      - ./bloque_c/sql:/app/sql:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [datos]
    restart: "no"

  web:
    build: ./sistema_web
    environment:
      <<: *entorno
      MICROSERVICIOS_URL: "http://{servicio}:{puerto}"   # el web consume los servicios por la red interna
    volumes:
      - ./bloque_c/sql/06_planeacion.sql:/app/06_planeacion.sql:ro
      - ./bloque_c/sql/07_web_ampliado.sql:/app/07_web_ampliado.sql:ro
    command: >
      sh -c "python migrar_planeacion.py && python migrar_web.py &&
             exec gunicorn -b 0.0.0.0:5000 -w 3 --timeout 60 app:app"
    ports: ["${WEB_PORT:-5000}:5000"]
    depends_on:
      migraciones: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [datos, publica]
    restart: unless-stopped

  auth:
    <<: *servicio
    build: {context: ., dockerfile: servicios/auth/Dockerfile}
    environment: *entorno
    ports: ["5101:5101"]

  usuarios:
    <<: *servicio
    build: {context: ., dockerfile: servicios/usuarios/Dockerfile}
    environment: *entorno
    ports: ["5102:5102"]

  productos:
    <<: *servicio
    build: {context: ., dockerfile: servicios/productos/Dockerfile}
    environment: *entorno
    ports: ["5103:5103"]

  pedidos:
    <<: *servicio
    build: {context: ., dockerfile: servicios/pedidos/Dockerfile}
    environment: *entorno
    ports: ["5104:5104"]

  entregas:
    <<: *servicio
    build: {context: ., dockerfile: servicios/entregas/Dockerfile}
    environment: *entorno
    ports: ["5105:5105"]

  planeacion:
    <<: *servicio
    build: {context: ., dockerfile: servicios/planeacion/Dockerfile}
    environment: *entorno
    ports: ["5106:5106"]

  documentos:
    <<: *servicio
    build: {context: ., dockerfile: servicios/documentos/Dockerfile}
    environment:
      <<: *entorno
      ALMACEN_DIR: /app/almacen              # con ALMACEN=local, los archivos viven en un volumen y sobreviven a recrear el contenedor
    volumes:
      - datos_archivos:/app/almacen
    ports: ["5107:5107"]

  zonas:
    <<: *servicio
    build: {context: ., dockerfile: servicios/zonas/Dockerfile}
    environment: *entorno
    ports: ["5108:5108"]

  microhubs:
    <<: *servicio
    build: {context: ., dockerfile: servicios/microhubs/Dockerfile}
    environment: *entorno
    ports: ["5109:5109"]

  seguimiento:
    <<: *servicio
    build: {context: ., dockerfile: servicios/seguimiento/Dockerfile}
    environment: *entorno
    ports: ["5110:5110"]

  inventario:
    <<: *servicio
    build: {context: ., dockerfile: servicios/inventario/Dockerfile}
    environment: *entorno
    ports: ["5111:5111"]

  precios:
    <<: *servicio
    build: {context: ., dockerfile: servicios/precios/Dockerfile}
    environment: *entorno
    ports: ["5112:5112"]

  proveedores:
    <<: *servicio
    build: {context: ., dockerfile: servicios/proveedores/Dockerfile}
    environment: *entorno
    ports: ["5113:5113"]

  abastecimiento:
    <<: *servicio
    build: {context: ., dockerfile: servicios/abastecimiento/Dockerfile}
    environment: *entorno
    ports: ["5114:5114"]

  notificaciones:
    <<: *servicio
    build: {context: ., dockerfile: servicios/notificaciones/Dockerfile}
    environment: *entorno
    ports: ["5124:5124"]

  demanda:
    <<: *servicio
    build: {context: ., dockerfile: servicios/demanda/Dockerfile}
    environment: *entorno
    ports: ["5115:5115"]

  cobertura:
    <<: *servicio
    build: {context: ., dockerfile: servicios/cobertura/Dockerfile}
    environment: *entorno
    ports: ["5116:5116"]

  capacidad:
    <<: *servicio
    build: {context: ., dockerfile: servicios/capacidad/Dockerfile}
    environment: *entorno
    ports: ["5117:5117"]

  rutas:
    <<: *servicio
    build: {context: ., dockerfile: servicios/rutas/Dockerfile}
    environment: *entorno
    ports: ["5118:5118"]

  costos:
    <<: *servicio
    build: {context: ., dockerfile: servicios/costos/Dockerfile}
    environment: *entorno
    ports: ["5119:5119"]

  punto-equilibrio:
    <<: *servicio
    build: {context: ., dockerfile: servicios/punto_equilibrio/Dockerfile}
    environment: *entorno
    ports: ["5120:5120"]

  simulacion:
    <<: *servicio
    build: {context: ., dockerfile: servicios/simulacion/Dockerfile}
    environment: *entorno
    ports: ["5121:5121"]

  surtido:
    <<: *servicio
    build: {context: ., dockerfile: servicios/surtido/Dockerfile}
    environment: *entorno
    ports: ["5122:5122"]

  auditoria-monitoreo:
    <<: *servicio
    build: {context: ., dockerfile: servicios/auditoria_monitoreo/Dockerfile}
    environment: *entorno
    ports: ["5126:5126"]

  reportes:
    <<: *servicio
    build: {context: ., dockerfile: servicios/reportes/Dockerfile}
    environment:
      <<: *entorno
      ALMACEN_DIR: /app/almacen              # las exportaciones archivadas sobreviven a recrear el contenedor
    volumes:
      - datos_archivos:/app/almacen
    ports: ["5123:5123"]

  sincronizacion:
    <<: *servicio
    build: {context: ., dockerfile: servicios/sincronizacion/Dockerfile}
    environment: *entorno
    ports: ["5125:5125"]

networks:
  publica:
  datos:
    internal: true           # PostgreSQL, Redis y MongoDB sin salida a Internet ni puertos al host

volumes:
  datos_pg:
  datos_mongo:
  datos_archivos:
