{% set e = request.endpoint %}
<style>
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.subnav a{font-size:13.5px;padding:6px 13px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--ink2)}
.subnav a.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.subnav a:hover{text-decoration:none;border-color:var(--ink3)}
.barra{height:16px;background:var(--cobalt);border-radius:3px;min-width:2px}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:20px;border:1px solid}
.pill.verde{color:var(--verde);background:var(--verde-l);border-color:var(--verde-b)}
.pill.ambar{color:var(--ambar);background:var(--ambar-l);border-color:var(--ambar-b)}
.pill.rojo{color:var(--rojo);background:var(--rojo-l);border-color:var(--rojo-b)}
.pill.gris{color:var(--ink2);background:var(--line2);border-color:var(--line)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 16px}
.pasos li{margin:4px 0 4px 18px;font-size:14px}
</style>
<nav class="subnav" aria-label="Planeación">
  <a href="{{ url_for('planeacion.tablero') }}" class="{{ 'sel' if e=='planeacion.tablero' }}">Tablero</a>
  <a href="{{ url_for('planeacion.demanda') }}" class="{{ 'sel' if e=='planeacion.demanda' }}">1 · Demanda</a>
  <a href="{{ url_for('planeacion.candidatos_lista') }}" class="{{ 'sel' if e and e.startswith('planeacion.candidat') }}">2 · Ubicaciones</a>
  <a href="{{ url_for('planeacion.cobertura') }}" class="{{ 'sel' if e=='planeacion.cobertura' }}">Cobertura y mapa</a>
  <a href="{{ url_for('planeacion.simulacion') }}" class="{{ 'sel' if e=='planeacion.simulacion' }}">3-4-7 · Simulación y equilibrio</a>
  <a href="{{ url_for('planeacion.surtido') }}" class="{{ 'sel' if e=='planeacion.surtido' }}">5 · Surtido</a>
  {% if 'entregas.asignar' in permisos %}<a href="{{ url_for('planeacion.entregas') }}">6 · Entregas</a>{% endif %}
  <a href="{{ url_for('planeacion.escenarios') }}" class="{{ 'sel' if e and e.startswith('planeacion.escenarios') }}">8 · Escenarios</a>
</nav>
