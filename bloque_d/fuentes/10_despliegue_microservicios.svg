4" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#20384c">MongoDB 7</text><text x="397" y="755" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" fill="#20384c">Volumen datos_mongo</text><rect x="705" y="690" width="305" height="90" rx="8" fill="#faebd2" stroke="#627e96" stroke-width="2"/><text x="722" y="724" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#20384c">Redis 7</text><text x="722" y="755" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" fill="#20384c">Sin persistencia</text><rect x="1030" y="690" width="305" height="90" rx="8" fill="#faebd2" stroke="#627e96" stroke-width="2"/><text x="1047" y="724" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#20384c">migraciones</text><text x="1047" y="755" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" fill="#20384c">Termina en Exited (0)</text><text x="45" y="851" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#20384c">Dependencias de arranque</text><text x="45" y="885" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#20384c">Migraciones espera PostgreSQL. Web espera migraciones y Redis.</text><text x="45" y="916" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#20384c">Los diez servicios esperan migraciones, Redis y MongoDB saludables.</text><text x="45" y="960" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#20384c">Los volúmenes persisten con down. La opción down -v elimina los datos.</text></svg>